name: Update IPv6 Records
on:
  schedule:
    - cron: "10 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Show environment
        run: |
          echo "========================================"
          echo "运行环境"
          echo "========================================"
          echo "当前目录："
          pwd
          echo
          echo "Python："
          python --version
          echo
          echo "仓库文件："
          ls -lah
          echo
          echo "========================================"
      - name: Fetch IPv6
        run: |
          echo "========================================"
          echo "开始获取 IPv6"
          echo "========================================"
          python update_ipv6.py
          echo
          echo "========================================"
          echo "IPv6 获取完成"
          echo "========================================"
      - name: Check CloudFront file
        run: |
          echo "========================================"
          echo "CloudFront-ipv6.txt"
          echo "========================================"
          if [ -f "CloudFront-ipv6.txt" ]; then
            echo "文件存在"
            echo
            echo "记录数量："
            wc -l CloudFront-ipv6.txt
            echo
            echo "最后20条："
            tail -20 CloudFront-ipv6.txt
          else
            echo "文件不存在"
          fi
      - name: Check CloudFlare file
        run: |
          echo "========================================"
          echo "CloudFlare-ipv6.txt"
          echo "========================================"
          if [ -f "CloudFlare-ipv6.txt" ]; then
            echo "文件存在"
            echo
            echo "记录数量："
            wc -l CloudFlare-ipv6.txt
            echo
            echo "最后20条："
            tail -20 CloudFlare-ipv6.txt
          else
            echo "文件不存在"
          fi
      - name: Check Git changes
        run: |
          echo "========================================"
          echo "Git 状态"
          echo "========================================"
          git status --short
          echo
          echo "========================================"
          echo "Git Diff"
          echo "========================================"
          git diff --stat
      - name: Commit and push
        run: |
          echo "========================================"
          echo "准备提交"
          echo "========================================"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo
            echo "没有数据变化，不需要提交"
          else
            echo
            echo "检测到数据变化："
            git status --short
            echo
            echo "提交数据..."
            git commit -m "Update IPv6 records"
            echo
            echo "推送到 GitHub..."
            git push
            echo
            echo "GitHub 更新完成"
          fi
      - name: Final check
        run: |
          echo "========================================"
          echo "最终文件"
          echo "========================================"
          ls -lah
          echo
          echo "CloudFront："
          if [ -f "CloudFront-ipv6.txt" ]; then
            wc -l CloudFront-ipv6.txt
          else
            echo "不存在"
          fi
          echo
          echo "CloudFlare："
          if [ -f "CloudFlare-ipv6.txt" ]; then
            wc -l CloudFlare-ipv6.txt
          else
            echo "不存在"
          fi
          echo
          echo "========================================"
          echo "任务完成"
          echo "========================================"
          
