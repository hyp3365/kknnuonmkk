name: Update IPv6 Records

on:

  # ==========================================================
  # 每天运行一次
  #
  # GitHub 使用 UTC 时间
  # 这里是 UTC 00:10
  # 北京时间为 08:10
  # ==========================================================

  schedule:
    - cron: "10 0 * * *"


  # ==========================================================
  # GitHub Actions 页面手动运行
  # ==========================================================

  workflow_dispatch:


# ============================================================
# 允许 Actions 修改仓库内容
# ============================================================

permissions:
  contents: write


# ============================================================
# Job
# ============================================================

jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 1. 拉取仓库
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # 2. 安装 Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # ======================================================
      # 3. 显示运行环境
      # ======================================================

      - name: Show environment

        run: |

          echo "========================================"
          echo "运行环境"
          echo "========================================"

          echo "当前目录："
          pwd

          echo

          echo "Python："
          python --version

          echo

          echo "仓库文件："
          ls -lah

          echo
          echo "========================================"


      # ======================================================
      # 4. 执行 IPv6 采集
      # ======================================================

      - name: Fetch IPv6

        run: |

          echo "========================================"
          echo "开始获取 IPv6"
          echo "========================================"

          python update_ipv6.py

          echo
          echo "========================================"
          echo "IPv6 获取完成"
          echo "========================================"


      # ======================================================
      # 5. 检查 CloudFront 文件
      # ======================================================

      - name: Check CloudFront file

        run: |

          echo "========================================"
          echo "CloudFront-ipv6.txt"
          echo "========================================"

          if [ -f "CloudFront-ipv6.txt" ]; then

            echo "文件存在"

            echo
            echo "记录数量："

            wc -l CloudFront-ipv6.txt

            echo
            echo "最后20条："

            tail -20 CloudFront-ipv6.txt

          else

            echo "文件不存在"

          fi


      # ======================================================
      # 6. 检查 CloudFlare 文件
      # ======================================================

      - name: Check CloudFlare file

        run: |

          echo "========================================"
          echo "CloudFlare-ipv6.txt"
          echo "========================================"

          if [ -f "CloudFlare-ipv6.txt" ]; then

            echo "文件存在"

            echo
            echo "记录数量："

            wc -l CloudFlare-ipv6.txt

            echo
            echo "最后20条："

            tail -20 CloudFlare-ipv6.txt

          else

            echo "文件不存在"

          fi


      # ======================================================
      # 7. 查看 Git 修改
      # ======================================================

      - name: Check Git changes

        run: |

          echo "========================================"
          echo "Git 状态"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "Git Diff"
          echo "========================================"

          git diff --stat


      # ======================================================
      # 8. 提交到 GitHub
      # ======================================================

      - name: Commit and push

        run: |

          echo "========================================"
          echo "准备提交"
          echo "========================================"

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          # --------------------------------------------------
          # 自动添加所有新增、修改、删除的文件
          # --------------------------------------------------

          git add -A


          # --------------------------------------------------
          # 判断是否有变化
          # --------------------------------------------------

          if git diff --cached --quiet; then

            echo
            echo "没有数据变化，不需要提交"

          else

            echo
            echo "检测到数据变化："

            git status --short

            echo
            echo "提交数据..."

            git commit -m "Update IPv6 records"


            echo
            echo "推送到 GitHub..."

            git push


            echo
            echo "GitHub 更新完成"

          fi


      # ======================================================
      # 9. 最终文件列表
      # ======================================================

      - name: Final check

        run: |

          echo "========================================"
          echo "最终文件"
          echo "========================================"

          ls -lah

          echo

          echo "CloudFront："

          if [ -f "CloudFront-ipv6.txt" ]; then
            wc -l CloudFront-ipv6.txt
          else
            echo "不存在"
          fi

          echo

          echo "CloudFlare："

          if [ -f "CloudFlare-ipv6.txt" ]; then
            wc -l CloudFlare-ipv6.txt
          else
            echo "不存在"
          fi

          echo
          echo "========================================"
          echo "任务完成"
          echo "========================================"
