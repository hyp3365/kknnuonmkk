name: Build sing-box v1.14.1 with V2Ray API

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.14.1
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - name: Build
        run: |
          set -euxo pipefail
          TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_v2ray_api"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -o sing-box \
            -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=1.14.1' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box

      - name: Check build
        run: |
          chmod +x sing-box
          ./sing-box version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-v1.14.1-v2rayapi-linux-amd64
          path: sing-box
